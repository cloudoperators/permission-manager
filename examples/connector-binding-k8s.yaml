# Example: ConnectorBinding for Kubernetes provider
# Links ASRs to the Kubernetes RBAC provider with capability mapping.
apiVersion: permission-manager.cloudoperators.dev/v1
kind: ConnectorBinding
metadata:
  name: k8s-connector
  namespace: permission-manager
spec:
  name: Kubernetes Production
  provider: kubernetes
  definition:
    capabilityMapping:
      READ: "get,list,watch"
      WRITE: "create,update,patch,delete"
      OPERATE: "exec,port-forward,proxy"
      MANAGE: "bind,escalate,impersonate"
      "*": "*"
