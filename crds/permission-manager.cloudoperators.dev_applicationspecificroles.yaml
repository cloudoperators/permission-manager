---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: applicationspecificroles.permission-manager.cloudoperators.dev
spec:
  group: permission-manager.cloudoperators.dev
  names:
    kind: ApplicationSpecificRole
    listKind: ApplicationSpecificRoleList
    plural: applicationspecificroles
    singular: applicationspecificrole
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: ApplicationSpecificRole defines an access level with permissions
          and connector references.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplicationSpecificRoleSpec defines the desired state of
              ApplicationSpecificRole.
            properties:
              advancedConfig:
                description: AdvancedConfig is implementation-specific configuration
                  passed through to the connector.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              approvers:
                description: Approvers are access level-specific approvers.
                items:
                  description: Approver defines an approver for an access level or
                    profile.
                  properties:
                    applicationSpecificRole:
                      description: ApplicationSpecificRole is the reference to an
                        AccessLevel metadata.name whose holders may approve.
                      type: string
                    step:
                      description: Step is the approval step number.
                      type: integer
                    userID:
                      description: UserID is the ID of the approving user.
                      type: string
                  type: object
                type: array
              classification:
                description: Classification is the security classification level (e.g.,
                  SU2, VSNFD).
                type: string
              connectorRefs:
                description: ConnectorRefs are references to ConnectorBinding names
                  that provide tool configuration.
                items:
                  type: string
                minItems: 1
                type: array
              deny:
                description: Deny are denied permissions (exclusions).
                items:
                  description: Permission defines a resource + capability pair.
                  properties:
                    capability:
                      description: Capability is the capability name.
                      type: string
                    resource:
                      description: Resource is the resource name.
                      type: string
                  required:
                  - capability
                  - resource
                  type: object
                type: array
              description:
                description: Description is a human-readable description of the access
                  level.
                type: string
              displayName:
                description: DisplayName is the human-readable access level name displayed
                  in the CAM UI.
                type: string
              functionalRoleName:
                description: FunctionalRoleName is the name of the auto-generated
                  profile that includes this access level.
                type: string
              name:
                description: Name is the unique slugified identifier used as metadata.name.
                type: string
              permissions:
                description: Permissions are granted permissions (resource + capability
                  pairs).
                items:
                  description: Permission defines a resource + capability pair.
                  properties:
                    capability:
                      description: Capability is the capability name.
                      type: string
                    resource:
                      description: Resource is the resource name.
                      type: string
                  required:
                  - capability
                  - resource
                  type: object
                type: array
              tags:
                description: Tags for environment filtering (e.g., qa, prod).
                items:
                  type: string
                type: array
            required:
            - connectorRefs
            - name
            type: object
          status:
            description: ApplicationSpecificRoleStatus defines the observed state
              of ApplicationSpecificRole.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the ASR's state.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              providers:
                additionalProperties:
                  description: ProviderStatus tracks the reconciliation state for
                    a single provider.
                  properties:
                    lastReconciled:
                      description: LastReconciled is the timestamp of the last reconciliation
                        attempt.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable summary of the provider's
                        reconciliation state.
                      type: string
                    ready:
                      description: Ready indicates whether the provider has successfully
                        reconciled all targets.
                      type: boolean
                    targets:
                      description: Targets contains per-target provisioning status.
                      items:
                        description: TargetStatus tracks the provisioning state for
                          a single target within a provider.
                        properties:
                          lastUpdated:
                            description: LastUpdated is the timestamp of the last
                              provisioning attempt for this target.
                            format: date-time
                            type: string
                          message:
                            description: Message is a human-readable description of
                              the result.
                            type: string
                          status:
                            description: Status is the provisioning result (e.g.,
                              Success, Error, Unreachable).
                            type: string
                          targetID:
                            description: TargetID is the identifier of the target
                              (e.g., cluster name).
                            type: string
                        required:
                        - lastUpdated
                        - status
                        - targetID
                        type: object
                      type: array
                  required:
                  - lastReconciled
                  - ready
                  type: object
                description: Providers maps provider name to its reconciliation status.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
