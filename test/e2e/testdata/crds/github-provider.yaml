---
# Minimal CRD for GithubOrganization — just enough schema for E2E testing.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githuborganizations.repo-guard.cloudoperators.dev
spec:
  group: repo-guard.cloudoperators.dev
  names:
    kind: GithubOrganization
    listKind: GithubOrganizationList
    plural: githuborganizations
    singular: githuborganization
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              # Keep the team-list fields typed (listType markers drive SSA merge);
              # preserve the rest so PM's identity writes (spec.organization, etc.) persist.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                defaultPublicRepositoryTeams:
                  type: array
                  items:
                    type: object
                    properties:
                      team:
                        type: string
                      permission:
                        type: string
                  x-kubernetes-list-map-keys:
                    - team
                  x-kubernetes-list-type: map
                defaultPrivateRepositoryTeams:
                  type: array
                  items:
                    type: object
                    properties:
                      team:
                        type: string
                      permission:
                        type: string
                  x-kubernetes-list-map-keys:
                    - team
                  x-kubernetes-list-type: map
                defaultInternalRepositoryTeams:
                  type: array
                  items:
                    type: object
                    properties:
                      team:
                        type: string
                      permission:
                        type: string
                  x-kubernetes-list-map-keys:
                    - team
                  x-kubernetes-list-type: map
                organizationOwnerTeams:
                  type: array
                  items:
                    type: string
                  x-kubernetes-list-type: set
