---
# Minimal CRD for GithubTeam — just enough schema for E2E testing.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githubteams.repo-guard.cloudoperators.dev
spec:
  group: repo-guard.cloudoperators.dev
  names:
    kind: GithubTeam
    listKind: GithubTeamList
    plural: githubteams
    singular: githubteam
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
