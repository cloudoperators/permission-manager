---
# Minimal CRD for Team (greenhouse.sap/v1alpha1) — just enough schema for E2E testing.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teams.greenhouse.sap
spec:
  group: greenhouse.sap
  names:
    kind: Team
    listKind: TeamList
    plural: teams
    singular: team
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mappedIdPGroup:
                  type: string
              required:
                - mappedIdPGroup
---
# Minimal CRD for TeamRoleBinding (greenhouse.sap/v1alpha2) — just enough schema for E2E testing.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teamrolebindings.greenhouse.sap
spec:
  group: greenhouse.sap
  names:
    kind: TeamRoleBinding
    listKind: TeamRoleBindingList
    plural: teamrolebindings
    singular: teamrolebinding
  scope: Namespaced
  versions:
    - name: v1alpha2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                teamRoleRef:
                  type: string
                teamRef:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                clusterSelector:
                  type: object
                  properties:
                    clusterName:
                      type: string
                namespaces:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                statusConditions:
                  type: object
                  properties:
                    conditions:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          status:
                            type: string
      subresources:
        status: {}
---
# Minimal CRD for TeamRole (greenhouse.sap/v1alpha1) — just enough schema for E2E testing.
# TeamRole is a pre-existing Greenhouse CRD that TeamRoleBindings reference.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teamroles.greenhouse.sap
spec:
  group: greenhouse.sap
  names:
    kind: TeamRole
    listKind: TeamRoleList
    plural: teamroles
    singular: teamrole
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
