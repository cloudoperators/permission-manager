apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "permission-manager.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - greenhouse.sap
    resources:
      - clusters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles/finalizers
    verbs:
      - update
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - connectorbindings
      - functionalroles
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - repo-guard.cloudoperators.dev
    resources:
      - githuborganizations
      - githubteamrepositories
      - githubteams
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
