{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: permission-manager
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "permission-manager.resourceName" (dict "suffix" "connectorbinding-admin-role" "context" $) }}
rules:
- apiGroups:
  - permission-manager.cloudoperators.dev
  resources:
  - connectorbindings
  verbs:
  - '*'
- apiGroups:
  - permission-manager.cloudoperators.dev
  resources:
  - connectorbindings/status
  verbs:
  - get
{{- end }}
