apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pm-controller
rules:
  # Permission Manager CRDs
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles
      - connectorbindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles
    verbs:
      - update
      - patch
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles/finalizers
    verbs:
      - update
  # Secrets (kubeconfig access for remote cluster clients)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  # Greenhouse Cluster CRDs
  - apiGroups:
      - greenhouse.sap
    resources:
      - clusters
    verbs:
      - get
      - list
      - watch
  # Greenhouse Teams/TeamRoleBindings/TeamRoles
  - apiGroups:
      - greenhouse.sap
    resources:
      - teams
      - teamrolebindings
      - teamroles
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - greenhouse.sap
    resources:
      - teamrolebindings/status
    verbs:
      - get
      - update
      - patch
  # GitHub provider CRDs (repo-guard)
  - apiGroups:
      - repo-guard.cloudoperators.dev
    resources:
      - githubteams
      - githubteamrepositories
      - githuborganizations
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - repo-guard.cloudoperators.dev
    resources:
      - githubteams/status
    verbs:
      - get
      - update
      - patch
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
