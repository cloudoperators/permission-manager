# Minimal CRD for GithubTeamRepository — just enough schema for E2E testing.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: githubteamrepositories.repo-guard.cloudoperators.dev
spec:
  group: repo-guard.cloudoperators.dev
  names:
    kind: GithubTeamRepository
    listKind: GithubTeamRepositoryList
    plural: githubteamrepositories
    singular: githubteamrepository
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                repositories:
                  type: array
