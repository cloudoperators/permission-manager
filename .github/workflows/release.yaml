name: Release

on:
  workflow_dispatch:
    inputs:
      image-build:
        description: "Build, push and sign the controller image"
        type: boolean
        default: true
      chart-build:
        description: "Package and push the Helm chart"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    if: ${{ inputs.image-build }}
    name: Build, push and sign image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read chart appVersion
        id: ver
        run: echo "version=$(grep '^appVersion:' charts/permission-manager/Chart.yaml | awk '{print $2}' | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Image tag is the chart appVersion (vX.Y.Z), bumped in a PR before release.
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  helm:
    if: ${{ inputs.chart-build }}
    name: Package and push chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Package and push Helm chart to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          CHART_NAME=$(grep '^name:' charts/permission-manager/Chart.yaml | awk '{print $2}')
          CHART_VERSION=$(grep '^version:' charts/permission-manager/Chart.yaml | awk '{print $2}')

          echo "Packaging chart $CHART_NAME version $CHART_VERSION"
          helm package charts/permission-manager

          echo "Logging in to $REGISTRY"
          echo "$GHCR_TOKEN" | helm registry login "$REGISTRY" --username "$GHCR_USER" --password-stdin

          echo "Pushing chart to $REGISTRY"
          helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${OWNER}/charts"

  vulnerability-scan:
    if: ${{ inputs.image-build }}
    name: Vulnerability scan
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
