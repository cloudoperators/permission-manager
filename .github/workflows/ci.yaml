name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: cloudoperators/common/.github/workflows/shared-go-lint.yaml@main

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: cloudoperators/common/.github/workflows/shared-go-test.yaml@main

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: cloudoperators/common/.github/workflows/shared-go-build.yaml@main
    with:
      docker-build: true

  checksOK:
    name: checksOK
    needs: [lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: PR checks
        run: |
          fail=0
          for r in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "::error ::One or more checks failed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }}, build=${{ needs.build.result }})"
            exit 1
          fi
          echo "All checks passed"
