apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
    name: k8sclusters.k8s.{{ .Values.ccrn.apiGroup }}
    annotations:
        description: |
            Represents a Kubernetes cluster as an access target for cluster-scoped RBAC.
            Used by Permission Manager ASRs to express access to cluster-scoped resources
            (Nodes, Namespaces, PersistentVolumes, CRDs, ClusterRoles) on Greenhouse-managed clusters.
        ccrn/v1.examples: |
            Cluster-wide access on eu-de-1:

            (URN FORMAT) urn:ccrn:cluster.k8s.ccrn.cloudoperators.dev/v1/eu-de-1
            OR
            (CCRN FORMAT) ccrn=cluster.k8s.ccrn.cloudoperators.dev/v1, cluster=eu-de-1

            Cluster-wide access on all clusters:

            (URN FORMAT) urn:ccrn:cluster.k8s.ccrn.cloudoperators.dev/v1/*
            OR
            (CCRN FORMAT) ccrn=cluster.k8s.ccrn.cloudoperators.dev/v1, cluster=*
        ccrn/resource-criticality: "critical"
        ccrn/v1.urn-template: "urn:ccrn:<ccrn>/<cluster>"
        ccrn/v1.url-template: "https://<ccrn>/<cluster>"
spec:
    group: k8s.{{ .Values.ccrn.apiGroup }}
    names:
        kind: K8sCluster
        listKind: K8sClusterList
        plural: k8sclusters
        singular: k8scluster
    scope: Namespaced
    versions:
        -   name: v1
            served: true
            storage: true
            schema:
                openAPIV3Schema:
                    type: object
                    required: [ "ccrn", "cluster" ]
                    properties:
                        ccrn:
                            type: string
                            enum: [ "cluster.k8s.{{ .Values.ccrn.apiGroup }}/v1" ]
                        cluster:
                            type: string
                            description: "Target cluster name (matches Greenhouse Cluster.metadata.name), prefix wildcard (e.g. nw-a-*), or * for all clusters"
                            pattern: "^([a-z0-9]([a-z0-9-]*[a-z0-9])?|[a-z0-9][a-z0-9-]*\\*|\\*)$"
                            maxLength: 63
            additionalPrinterColumns:
                -   name: CCRN
                    type: string
                    jsonPath: .ccrn
                -   name: Cluster
                    type: string
                    jsonPath: .cluster
                -   name: Age
                    type: date
                    jsonPath: .metadata.creationTimestamp
