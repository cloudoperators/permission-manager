apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
    name: githubrepositorytypes.github.{{ .Values.ccrn.apiGroup }}
    annotations:
        description: |
            Represents a class of GitHub repositories filtered by visibility type.
            Used by Permission Manager ASRs to express access scoped to repository
            visibility categories (public, private, internal) within an organization.
        ccrn/v1.examples: |
            All public repositories in the cc organization:

            (URN FORMAT) urn:ccrn:repository_type.github.ccrn.cloudoperators.dev/v1/github.example.com/cc/public
            OR
            (CCRN FORMAT) ccrn=repository_type.github.ccrn.cloudoperators.dev/v1, instance=github.example.com, owner=cc, type=public

            All repository types (any visibility) in my-org:

            (URN FORMAT) urn:ccrn:repository_type.github.ccrn.cloudoperators.dev/v1/github.example.com/my-org/*
            OR
            (CCRN FORMAT) ccrn=repository_type.github.ccrn.cloudoperators.dev/v1, instance=github.example.com, owner=my-org, type=*
        ccrn/resource-criticality: "medium"
        ccrn/v1.urn-template: "urn:ccrn:<ccrn>/<instance>/<owner>/<type>"
        ccrn/v1.url-template: "https://<instance>/<owner>"
spec:
    group: github.{{ .Values.ccrn.apiGroup }}
    names:
        kind: GithubRepositoryType
        listKind: GithubRepositoryTypeList
        plural: githubrepositorytypes
        singular: githubrepositorytype
    scope: Namespaced
    versions:
        -   name: v1
            served: true
            storage: true
            schema:
                openAPIV3Schema:
                    type: object
                    required: [ "ccrn", "instance", "owner", "type" ]
                    properties:
                        ccrn:
                            type: string
                            enum: [ "repository_type.github.{{ .Values.ccrn.apiGroup }}/v1" ]
                        instance:
                            type: string
                            description: "GitHub Enterprise instance hostname"
                            enum: [ "github.com", "github.example.com" ]
                        owner:
                            type: string
                            description: "GitHub organization name"
                            enum: [ "my-org", "cloudoperators", "example-team", "*" ]
                            maxLength: 63
                        type:
                            type: string
                            description: "Repository visibility type"
                            enum: [ "public", "private", "internal", "*" ]
            additionalPrinterColumns:
                -   name: CCRN
                    type: string
                    jsonPath: .ccrn
                -   name: Instance
                    type: string
                    jsonPath: .instance
                -   name: Owner
                    type: string
                    jsonPath: .owner
                -   name: Type
                    type: string
                    jsonPath: .type
                -   name: Age
                    type: date
                    jsonPath: .metadata.creationTimestamp
