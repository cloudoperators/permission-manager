{{- if .Values.github.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pm-controller.fullname" . }}-github
  labels:
    {{- include "pm-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: github
rules:
  # Permission Manager CRDs - ApplicationSpecificRoles
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - applicationspecificroles/status
    verbs:
      - get
      - update
      - patch
  # Permission Manager CRDs - ConnectorBindings
  - apiGroups:
      - permission-manager.cloudoperators.dev
    resources:
      - connectorbindings
    verbs:
      - get
      - list
      - watch
  # Repo Guard CRDs
  - apiGroups:
      - repo-guard.cloudoperators.dev
    resources:
      - githubteams
      - githubteamrepositories
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - repo-guard.cloudoperators.dev
    resources:
      - githuborganizations
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pm-controller.fullname" . }}-github
  labels:
    {{- include "pm-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: github
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pm-controller.fullname" . }}-github
subjects:
  - kind: ServiceAccount
    name: {{ include "pm-controller.fullname" . }}-github
    namespace: {{ .Release.Namespace }}
{{- end }}
