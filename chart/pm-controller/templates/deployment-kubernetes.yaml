{{- if .Values.kubernetes.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pm-controller.fullname" . }}-kubernetes
  labels:
    {{- include "pm-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubernetes
spec:
  replicas: {{ .Values.kubernetes.replicaCount }}
  selector:
    matchLabels:
      {{- include "pm-controller.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kubernetes
  template:
    metadata:
      labels:
        {{- include "pm-controller.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kubernetes
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pm-controller.fullname" . }}-kubernetes
      containers:
        - name: manager
          image: "{{ .Values.kubernetes.image.repository }}:{{ .Values.kubernetes.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.kubernetes.image.pullPolicy }}
          args:
            - --metrics-bind-address={{ .Values.kubernetes.metrics.bindAddress }}
            - --health-probe-bind-address={{ .Values.kubernetes.healthProbe.bindAddress }}
            {{- if .Values.kubernetes.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kubernetes.resources | nindent 12 }}
      {{- with .Values.kubernetes.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubernetes.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubernetes.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
