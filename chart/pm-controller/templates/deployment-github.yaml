{{- if .Values.github.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pm-controller.fullname" . }}-github
  labels:
    {{- include "pm-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: github
spec:
  replicas: {{ .Values.github.replicaCount }}
  selector:
    matchLabels:
      {{- include "pm-controller.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: github
  template:
    metadata:
      labels:
        {{- include "pm-controller.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: github
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pm-controller.fullname" . }}-github
      containers:
        - name: manager
          image: "{{ .Values.github.image.repository }}:{{ .Values.github.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.github.image.pullPolicy }}
          args:
            - --metrics-bind-address={{ .Values.github.metrics.bindAddress }}
            - --health-probe-bind-address={{ .Values.github.healthProbe.bindAddress }}
            {{- if .Values.github.leaderElection.enabled }}
            - --leader-elect
            - --leader-election-id=pm-controller-github.permission-manager.cloudoperators.dev
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.github.resources | nindent 12 }}
{{- end }}
