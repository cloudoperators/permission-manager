{{- if .Values.greenhouseTeams.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pm-controller.fullname" . }}-greenhouse-teams
  labels:
    {{- include "pm-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: greenhouse-teams
  {{- with .Values.greenhouseTeams.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
