groups:
  - name: permission-manager.controller
    rules:
    - alert: PermissionManagerReconcileErrorsHigh
      expr: |
        (sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m])))
          /
        (sum by (controller) (rate(controller_runtime_reconcile_total[5m])))
        > 0.1
      for: 15m
      labels:
        {{- include "pm-controller.alertLabels" . | nindent 8 }}
        controller: '{{`{{ $labels.controller }}`}}'
        playbook: https://github.com/cloudoperators/permission-manager/tree/main/pm-controller/docs/playbooks/reconcile-errors-high.md
      annotations:
        summary: 'High reconcile error rate in controller {{`{{ $labels.controller }}`}}'
        description: '{{`{{ $value | humanizePercentage }}`}} of reconcile operations are failing for {{`{{ $labels.controller }}`}}'

    - alert: PermissionManagerReconcileErrorsCritical
      expr: |
        (sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m])))
          /
        (sum by (controller) (rate(controller_runtime_reconcile_total[5m])))
        > 0.5
      for: 10m
      labels:
        {{- include "pm-controller.alertLabels" . | nindent 8 }}
        controller: '{{`{{ $labels.controller }}`}}'
        playbook: https://github.com/cloudoperators/permission-manager/tree/main/pm-controller/docs/playbooks/reconcile-errors-critical.md
      annotations:
        summary: 'Critical reconcile error rate in controller {{`{{ $labels.controller }}`}}'
        description: '{{`{{ $value | humanizePercentage }}`}} of reconcile operations are failing for {{`{{ $labels.controller }}`}}'

    - alert: PermissionManagerReconcileDurationHigh
      expr: |
        histogram_quantile(0.95,
          sum by (controller, le) (rate(controller_runtime_reconcile_time_seconds_bucket[10m]))
        ) > 30
      for: 15m
      labels:
        {{- include "pm-controller.alertLabels" . | nindent 8 }}
        controller: '{{`{{ $labels.controller }}`}}'
        playbook: https://github.com/cloudoperators/permission-manager/tree/main/pm-controller/docs/playbooks/reconcile-duration-high.md
      annotations:
        summary: 'Slow reconciliations (p95) in controller {{`{{ $labels.controller }}`}}'
        description: '95th percentile reconciliation duration exceeds 30s (current: {{`{{ $value | humanizeDuration }}`}})'

    - alert: PermissionManagerWorkqueueNotDrained
      expr: |
        sum by (name) (rate(workqueue_depth[5m])) > 0
      for: 15m
      labels:
        {{- include "pm-controller.alertLabels" . | nindent 8 }}
        controller: '{{`{{ $labels.name }}`}}'
        playbook: https://github.com/cloudoperators/permission-manager/tree/main/pm-controller/docs/playbooks/workqueue-not-drained.md
      annotations:
        summary: 'Workqueue backlog growing for {{`{{ $labels.name }}`}}'
        description: 'The workqueue for {{`{{ $labels.name }}`}} is not being drained'

    - alert: PermissionManagerControllerDown
      expr: |
        sum by (controller) (increase(controller_runtime_reconcile_total[30m])) == 0
      for: 30m
      labels:
        {{- include "pm-controller.alertLabels" . | nindent 8 }}
        controller: '{{`{{ $labels.controller }}`}}'
        playbook: https://github.com/cloudoperators/permission-manager/tree/main/pm-controller/docs/playbooks/controller-down.md
      annotations:
        summary: 'No reconcile activity for controller {{`{{ $labels.controller }}`}}'
        description: 'Controller {{`{{ $labels.controller }}`}} has not performed any reconciles in 30 minutes'
