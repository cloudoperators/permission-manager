groups:
  - name: permission-manager.common-problems
    rules:
    - alert: PermissionManagerPodRestarting
      expr: |
        increase(kube_pod_container_status_restarts_total{container="manager", pod=~".*pm-controller.*"}[15m]) > 0
      for: 15m
      labels:
        {{- include "pm-controller.alertLabels" . | nindent 8 }}
        pod: '{{`{{ $labels.pod }}`}}'
        playbook: https://github.com/cloudoperators/permission-manager/tree/main/pm-controller/docs/playbooks/pod-restarting.md
      annotations:
        summary: 'Permission Manager pod {{`{{ $labels.pod }}`}} is restarting'
        description: 'Pod {{`{{ $labels.pod }}`}} has restarted in the last 15 minutes'

    - alert: PermissionManagerHighMemory
      expr: |
        container_memory_working_set_bytes{container="manager", pod=~".*pm-controller.*"}
          /
        container_spec_memory_limit_bytes{container="manager", pod=~".*pm-controller.*"}
        > 0.8
      for: 10m
      labels:
        {{- include "pm-controller.alertLabels" . | nindent 8 }}
        pod: '{{`{{ $labels.pod }}`}}'
        playbook: https://github.com/cloudoperators/permission-manager/tree/main/pm-controller/docs/playbooks/high-memory.md
      annotations:
        summary: 'Permission Manager pod {{`{{ $labels.pod }}`}} memory usage > 80%'
        description: 'Pod {{`{{ $labels.pod }}`}} is using {{`{{ $value | humanizePercentage }}`}} of its memory limit'
