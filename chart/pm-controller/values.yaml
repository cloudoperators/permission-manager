# Default values for pm-controller.

# --- Aggregator controller (status aggregation) ---
replicaCount: 1

image:
  repository: ghcr.io/cloudoperators/pm-controller-aggregator
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  name: ""
  # Annotations to add to the service account
  annotations: {}

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

leaderElection:
  enabled: true

metrics:
  bindAddress: ":8080"

healthProbe:
  bindAddress: ":8081"

nodeSelector: {}
tolerations: []
affinity: {}

# --- Kubernetes provider controller ---
kubernetes:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/cloudoperators/pm-controller-kubernetes
    tag: ""  # Defaults to appVersion
    pullPolicy: IfNotPresent

  serviceAccount:
    annotations: {}

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

  leaderElection:
    enabled: true

  metrics:
    bindAddress: ":8080"

  healthProbe:
    bindAddress: ":8081"

  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- GitHub provider controller ---
github:
  enabled: true
  replicaCount: 1
  image:
    repository: pm-controller-github
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  metrics:
    bindAddress: ":8080"
  healthProbe:
    bindAddress: ":8081"
  leaderElection:
    enabled: true
  serviceAccount:
    annotations: {}

# --- GreenhouseTeams provider controller ---
greenhouseTeams:
  enabled: true
  replicaCount: 1
  image:
    repository: pm-controller-greenhouse-teams
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  metrics:
    bindAddress: ":8080"
  healthProbe:
    bindAddress: ":8081"
  leaderElection:
    enabled: true
  serviceAccount:
    annotations: {}

# --- Alerting & Monitoring ---
alerts:
  enabled: true
  # Default severity for all alerts (override per-environment)
  severity: info
  # Greenhouse routing labels
  labels:
    support_group: ""
    service: "permission-manager"
