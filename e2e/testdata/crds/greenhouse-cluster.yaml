# Minimal stub of the Greenhouse Cluster CRD (clusters.greenhouse.sap).
# The e2e suite simulates Greenhouse: it creates Cluster CRs to register
# downstream targets and patches their status to KubeConfigValid=True. The
# Permission Manager controller only needs the Cluster object to exist in its
# informer store (keyed by namespace/name) to resolve a CCRN cluster segment;
# it loads the actual kubeconfig from the same-named Secret.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.greenhouse.sap
spec:
  group: greenhouse.sap
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
