apiVersion: permission-manager.cloudoperators.dev/v1alpha1
kind: ConnectorBinding
metadata:
  name: e2e-k8s
spec:
  name: e2e-k8s
  provider: kubernetes
  definition:
    capabilityMapping:
      cluster:
        READ:
          clusterRoleSelectors:
            - matchLabels:
                rbac.authorization.k8s.io/aggregate-to-view: "true"
      namespace:
        READ:
          clusterRoleSelectors:
            - matchLabels:
                rbac.authorization.k8s.io/aggregate-to-view: "true"
        OPERATE:
          clusterRoleSelectors:
            - matchLabels:
                rbac.authorization.k8s.io/aggregate-to-edit: "true"
