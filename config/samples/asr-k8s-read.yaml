# Example: Kubernetes cluster READ access
# This ASR grants read-only access to the "monitoring" namespace on cluster "prod-eu-1".
apiVersion: permission-manager.cloudoperators.dev/v1
kind: ApplicationSpecificRole
metadata:
  name: team-platform-monitoring-viewer
  namespace: permission-manager
spec:
  name: TEAM_PLATFORM_MONITORING_VIEWER
  description: "Read access to monitoring namespace on prod-eu-1"
  connectorRefs:
    - k8s-connector
  permissions:
    - resource: "urn:ccrn:namespace.k8s.ccrn.cloudoperators.dev/v1/prod-eu-1/monitoring"
      capability: READ
    - resource: "urn:ccrn:namespace.k8s.ccrn.cloudoperators.dev/v1/prod-eu-1/observability"
      capability: READ
  tags:
    - prod
