# Example: Kubernetes cluster READ access
# This ASR grants read-only access to monitoring and observability namespaces on kind-greenhouse-remote.
apiVersion: permission-manager.cloudoperators.dev/v1alpha1
kind: ApplicationSpecificRole
metadata:
  name: team-platform-monitoring-viewer
spec:
  name: TEAM_PLATFORM_MONITORING_VIEWER
  description: "Read access to monitoring namespace on kind-greenhouse-remote"
  connectorRefs:
    - k8s-connector
  permissions:
    - resource: "urn:ccrn:namespace.k8s.ccrn.cloudoperators.dev/v1/kind-greenhouse-remote/monitoring"
      capability: READ
    - resource: "urn:ccrn:namespace.k8s.ccrn.cloudoperators.dev/v1/kind-greenhouse-remote/observability"
      capability: READ
  tags:
    - prod
