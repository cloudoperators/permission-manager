# Scenario: ASR references a ConnectorBinding that does not exist (or no
# kubernetes-provider CB is referenced at all).
# Expected: EnsureConnectorBindings finds zero usable CBs, calls setDegraded
# inline with "no kubernetes ConnectorBindings referenced by ASR" and Breaks
# the subroutine chain. ASR status goes Degraded; no RBAC provisioned.
apiVersion: permission-manager.cloudoperators.dev/v1alpha1
kind: ApplicationSpecificRole
metadata:
  name: scenario-missing-cb
spec:
  name: SCENARIO_MISSING_CB
  connectorRefs:
    - does-not-exist-cb
  permissions:
    - resource: "urn:ccrn:namespace.k8s.ccrn.cloudoperators.dev/v1/kind-greenhouse-remote/monitoring"
      capability: READ