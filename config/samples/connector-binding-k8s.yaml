# Example: ConnectorBinding for Kubernetes provider
# Links ASRs to the Kubernetes RBAC provider with capability mapping.
#
# capabilityMapping is nested by scope (cluster vs namespace). Each scope maps a
# closed set of capability names to the RBAC the controller provisions:
#   cluster:   MANAGE, READ
#   namespace: MANAGE, OPERATE, READ
# A capability name outside its scope's set is rejected (InvalidCCRN).
#
# Each entry takes one of two mutually exclusive shapes:
#   - clusterRoleName: bind directly to a named ClusterRole. Valid only for
#     cluster MANAGE (cluster-admin).
#   - clusterRoleSelectors (+ optional rules): the controller builds an
#     aggregated root ClusterRole from the selectors and a baseline child
#     ClusterRole from the rules.
# OPERATE is intentionally left unmapped here so asr-k8s-unmapped-capability.yaml
# can demonstrate the unmapped-capability path.
apiVersion: permission-manager.cloudoperators.dev/v1alpha1
kind: ConnectorBinding
metadata:
  name: k8s-connector
spec:
  name: k8s-connector
  provider: kubernetes
  definition:
    capabilityMapping:
      cluster:
        MANAGE:
          clusterRoleName: cluster-admin
        READ:
          clusterRoleSelectors:
            - matchLabels:
                rbac.authorization.k8s.io/aggregate-to-view: "true"
          # Cluster-scoped resources only; namespaced resources are covered by
          # the aggregated view role. Secrets intentionally omitted.
          rules:
            - apiGroups: [""]
              resources: ["nodes", "namespaces", "persistentvolumes"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses", "volumeattachments"]
              verbs: ["get", "list", "watch"]
      namespace:
        MANAGE:
          # admin grants Secret access - intentional for namespace administrators.
          clusterRoleSelectors:
            - matchLabels:
                rbac.authorization.k8s.io/aggregate-to-admin: "true"
        READ:
          clusterRoleSelectors:
            - matchLabels:
                rbac.authorization.k8s.io/aggregate-to-view: "true"
