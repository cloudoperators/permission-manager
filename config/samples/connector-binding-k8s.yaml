# Example: ConnectorBinding for Kubernetes provider
# Links ASRs to the Kubernetes RBAC provider with capability mapping.
#
# The capabilityMapping is operator-curated vocabulary read at reconcile time:
# each capability name (READ/WRITE/ADMIN/OPERATE) maps to a list of rules
# mirroring the native Kubernetes PolicyRule structure
# (apiGroups + resources + verbs). All three fields are required. WRITE
# explicitly repeats READ verbs because the controller does not inject them —
# "trust the CB".
apiVersion: permission-manager.cloudoperators.dev/v1alpha1
kind: ConnectorBinding
metadata:
  name: k8s-connector
spec:
  name: Kubernetes Production
  provider: kubernetes
  definition:
    capabilityMapping:
      READ:
        - apiGroups: ["", "apps", "batch"]
          resources: ["pods", "services", "configmaps", "deployments", "replicasets", "statefulsets", "jobs", "cronjobs"]
          verbs: [get, list, watch]
      WRITE:
        - apiGroups: ["", "apps", "batch"]
          resources: ["pods", "services", "configmaps", "deployments", "replicasets", "statefulsets", "jobs", "cronjobs"]
          verbs: [get, list, watch, create, update, patch, delete]
      ADMIN:
        - apiGroups: ["", "apps", "batch", "rbac.authorization.k8s.io", "networking.k8s.io"]
          resources: ["pods", "services", "configmaps", "deployments", "replicasets", "statefulsets", "jobs", "cronjobs", "roles", "rolebindings", "networkpolicies"]
          verbs: [get, list, watch, create, update, patch, delete]
      # Sub-resource access: pod exec/attach/portforward/proxy are `create`,
      # while pod logs are read with `get`.
      OPERATE:
        - apiGroups: [""]
          resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/proxy"]
          verbs: ["create"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]
      # Deny-driven grant: "read everything except secrets". Instead of
      # hand-enumerating every apiGroup/resource, declare excludeResources and
      # the controller composes the grant per target cluster from its discovered
      # API groups, subtracting only the named resources. Requires
      # resources: ["*"]; verbs are copied onto every emitted rule. Fails closed
      # (InvalidConfig=True, nothing applied) if the cluster's discovery is
      # unavailable, so a denied resource can never leak.
      READ_EXCEPT_SECRETS:
        - apiGroups: ["*"]
          resources: ["*"]
          excludeResources:
            - apiGroups: [""]
              resources: [secrets]
            - apiGroups: ["core.gardener.cloud"]
              resources: [internalsecrets]
          verbs: [get, list, watch]