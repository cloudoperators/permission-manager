# This rule is not used by the project kubebuilder-scaffold itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the permission-manager.cloudoperators.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubebuilder-scaffold
    app.kubernetes.io/managed-by: kustomize
  name: connectorbinding-editor-role
rules:
- apiGroups:
  - permission-manager.cloudoperators.dev
  resources:
  - connectorbindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - permission-manager.cloudoperators.dev
  resources:
  - connectorbindings/status
  verbs:
  - get
