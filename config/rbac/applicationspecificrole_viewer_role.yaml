# This rule is not used by the project permission-manager itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to permission-manager.cloudoperators.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: permission-manager
    app.kubernetes.io/managed-by: kustomize
  name: applicationspecificrole-viewer-role
rules:
- apiGroups:
  - permission-manager.cloudoperators.dev
  resources:
  - applicationspecificroles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - permission-manager.cloudoperators.dev
  resources:
  - applicationspecificroles/status
  verbs:
  - get
