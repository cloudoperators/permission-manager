#
# cert-manager HelmRelease for the local greenhouse stack on the management
# cluster. Installs cert-manager into the `greenhouse` namespace so the
# greenhouse webhook chart can use it.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  releaseName: cert-manager
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: cert-manager
      version: v1.19.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  targetNamespace: greenhouse
  storageNamespace: greenhouse
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    webhook:
      timeoutSeconds: 30