# Flux sources for the greenhouse stack.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1h0m0s
  url: https://charts.jetstack.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: greenhouse
  namespace: flux-system
spec:
  interval: 24h0m0s
  type: oci
  url: oci://ghcr.io/cloudoperators/greenhouse/charts