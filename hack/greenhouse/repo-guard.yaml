#
# Flux GitRepository + Kustomization that pulls the GitHub provider CRDs
# (GithubTeam, GithubTeamRepository, GithubOrganization, etc.) from
# cloudoperators/repo-guard and applies them to the management cluster.
#
# Required by the permission-manager controller's GitHub provider, which
# watches and reconciles these CRs.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: repo-guard
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/cloudoperators/repo-guard
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: repo-guard-crds
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  retryInterval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: repo-guard
  path: ./config/crd
  wait: true
